name: Cirak Bot

# KURULUM: GitHub -> Actions sekmesi -> "set up a workflow yourself" -> bu içeriği yapıştır -> Commit.
# Bu dosya main (varsayılan) dalda durur; her koşuda ARENA dalını çekip botu orada çalıştırır.
# Tetikleme: zamanlanmış (her saat :07 ve :37 UTC) + elle "Run workflow".

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cirak-bot
  cancel-in-progress: false

jobs:
  kosu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Arena dalini al
        uses: actions/checkout@v4
        with:
          ref: arena/71f59bcb-c-rak-bot
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kosucuyu calistir
        env:
          TEZGAH_CEREZ: ${{ secrets.TEZGAH_CEREZ }}
        run: python3 cirak/actions/cirak_kosu.py

      - name: Sonuclari arena dalina yaz
        if: always()
        run: |
          git config user.name "cirak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cirak/
          git commit -m "kosu $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push origin HEAD:arena/71f59bcb-c-rak-bot && break
            sleep 5
          done

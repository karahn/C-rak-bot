name: Cirak Bot

# Tetikleme: (1) arena dalinda cirak/komut.json degisince OTOMATIK
#           (2) saat basi :07 ve :37 (UTC)  (3) elle "Run workflow"
# Bu dosya main (varsayilan) dalda durur; her kosuda ARENA dalini cekip botu orada calistirir.

on:
  push:
    branches:
      - 'arena/71f59bcb-c-rak-bot'
    paths:
      - 'cirak/komut.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cirak-bot
  cancel-in-progress: false

jobs:
  kosu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Arena dalini al
        uses: actions/checkout@v4
        with:
          ref: arena/71f59bcb-c-rak-bot
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kosucuyu calistir
        env:
          TEZGAH_CEREZ: ${{ secrets.TEZGAH_CEREZ }}
        run: python3 cirak/actions/cirak_kosu.py

      - name: Sonuclari repoya yaz
        if: always()
        run: |
          git config user.name "cirak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cirak/
          git commit -m "kosu $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push origin HEAD:arena/71f59bcb-c-rak-bot && break
            sleep 5
          done

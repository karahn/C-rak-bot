name: Cirak Bot (arena)

# KURULUM (bir kez): Actions -> "set up a workflow yourself" -> bu icerik -> Commit (dal: arena).
# Tetikleme: cirak/komut.json degisince + elle "Run workflow" + zincir (bot kendini yeniden tetikler).

on:
  push:
    paths:
      - 'cirak/komut.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: cirak-bot
  cancel-in-progress: false

jobs:
  kosu:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kosucuyu calistir
        env:
          TEZGAH_CEREZ: ${{ secrets.TEZGAH_CEREZ }}
        run: python3 cirak/actions/cirak_kosu.py

      - name: Sonuclari repoya yaz
        if: always()
        run: |
          git config user.name "cirak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cirak/
          git commit -m "kosu $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push origin HEAD:arena/71f59bcb-c-rak-bot && break
            sleep 5
          done

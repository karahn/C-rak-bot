name: Cirak Bot

on:
  push:
    paths:
      - 'cirak/komut.json'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  kosu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kosucuyu calistir
        env:
          TEZGAH_CEREZ: ${{ secrets.TEZGAH_CEREZ }}
        run: python3 cirak/actions/cirak_kosu.py
      - name: Sonuclari repoya yaz
        if: always()
        run: |
          git config user.name "cirak-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cirak/
          git commit -m "kosu $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "degisiklik yok"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push origin HEAD:arena/71f59bcb-c-rak-bot && break
            sleep 5
          done
      - name: Self-trigger next run (24/7 continuous)
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          curl -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/cirak-bot.yml/dispatches \
            -d '{"ref":"arena/71f59bcb-c-rak-bot"}'

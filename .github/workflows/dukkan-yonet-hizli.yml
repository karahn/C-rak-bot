name: Dükkan Yönet Hızlı (Manuel)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dukkan-yonet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/71f59bcb-c-rak-bot
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sadece dükkan yönetimi çalıştır
        env:
          TEZGAH_CEREZ: ${{ secrets.TEZGAH_CEREZ }}
        run: |
          cd cirak/actions
          python3 << 'PYEOF'
          import sys
          import json
          import os
          
          cerez = os.environ.get('TEZGAH_CEREZ')
          if not cerez:
              print("❌ HATA: TEZGAH_CEREZ ortam değişkeni yok!")
              sys.exit(1)
          
          print("✅ Cerez bulundu")
          sys.path.insert(0, '.')
          import cirak_kosu
          
          op = cirak_kosu.oturum()
          print("✅ Oturum oluşturuldu")
          
          print("\n🏪 Dükkan yönetimi başlatılıyor...")
          sonuc = cirak_kosu.gorev_dukkan_yonet(op, {})
          
          print("\n=== DÜKKAN YÖNETİMİ SONUCU ===")
          print(f"Toplam dükkân: {sonuc.get('toplam', 0)}")
          print(f"Kasa toplanan: {sonuc.get('kasa_toplanan', 0)}")
          print(f"Kasa TL: {sonuc.get('kasa_tl', 0):.2f}")
          print(f"Raf doldurulan: {sonuc.get('raf_doldurulan', 0)}")
          print(f"Oto tedarik açılan: {sonuc.get('oto_acilan', 0)}")
          
          if sonuc.get('hatalar'):
              print(f"\n❌ Hatalar: {len(sonuc['hatalar'])}")
              for h in sonuc['hatalar'][:5]:
                  print(f"  - {h}")
          
          os.makedirs('../rapor', exist_ok=True)
          with open('../rapor/dukkan-yonet-hizli.json', 'w', encoding='utf-8') as f:
              json.dump(sonuc, f, ensure_ascii=False, indent=2)
          
          print("\n✅ Sonuç kaydedildi: cirak/rapor/dukkan-yonet-hizli.json")
          PYEOF

      - name: Sonuçları repoya yaz
        if: always()
        run: |
          git config user.name "dukkan-yonet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A cirak/
          git commit -m "🏪 Manuel dükkan yönetimi $(date -u '+%Y-%m-%d %H:%M') UTC" || echo "değişiklik yok"
          git push origin HEAD:arena/71f59bcb-c-rak-bot || echo "push başarısız"
